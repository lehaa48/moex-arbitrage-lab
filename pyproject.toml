[project]
name = "moex-arbitrage-lab"
version = "0.0.1"
description = "Research-only lead-lag study COMEX gold -> MOEX GOLD (P0 scaffold; trading disabled)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moex_arbitrage_lab"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "C4", "DTZ", "T20", "PT", "RET", "SIM",
    "PTH", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and start fixed local tools (PowerShell, Git Bash) by absolute path.
"tests/**/*.py" = ["S101", "S603", "S607"]
"scripts/**/*.py" = ["S603", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
# The base temp dir is cleared by pytest at start; it is always the project tmp/pytest.
# Network tests do not exist in P0; the marker is registered so that any future network
# test is deselected by the default (offline) gate.
addopts = [
    "--strict-markers", "--strict-config", "-ra", "--import-mode=importlib",
    "--basetemp=tmp/pytest", "-m", "not network",
]
markers = ["network: contacts an external host; never part of the default offline gate"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["moex_arbitrage_lab"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
